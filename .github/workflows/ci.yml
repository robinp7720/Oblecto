name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-guessit

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint:src
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Report coverage to DeepSource
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          curl https://deepsource.io/cli | sh
          ./bin/deepsource report --analyzer test-coverage --key javascript --value-file ./coverage/lcov.info
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}

  build:
    name: Build and start
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-guessit

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      # Starts the built server and the terminal UI on a throwaway config and database
      - run: npm run test:startup
      - name: Check the package contents
        run: npm pack --dry-run --ignore-scripts

  web:
    name: Web UI and playback in browsers
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm ci --prefix Oblecto-Web
      - run: npm run test:build --prefix Oblecto-Web
      - run: npm run lint --prefix Oblecto-Web
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --project=player-desktop --project=player-phone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  next-node:
    name: Tests on the next Node release
    runs-on: ubuntu-latest
    # Early warning only; Node 24 is the supported version.
    continue-on-error: true
    steps:
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-guessit

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: npm ci
      - run: npm test
